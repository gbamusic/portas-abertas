<style>
/* Layout: uma coluna de celular. Entrada = a capa (porta em arco) e um zoom para dentro da porta; depois a casa (nome + cafezinho); depois a carta com 4 selos.
   IDENTIDADE "Viva Jesus" (capa oficial): creme e pêssego quentes, marrom do VIVA, vinho-tijolo do JESUS, âmbar da luz, verde da guirlanda.
   Visual único (claro e quente), por escolha da identidade. Fontes hospedadas na pasta fonts/. */
@font-face { font-family: 'Abril Fatface'; src: url(fonts/abril-fatface-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Merriweather'; font-weight: 400; src: url(fonts/merriweather-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Merriweather'; font-weight: 400; font-style: italic; src: url(fonts/merriweather-latin-400-italic.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Merriweather'; font-weight: 700; src: url(fonts/merriweather-latin-700-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Courier Prime'; font-weight: 400; src: url(fonts/courier-prime-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Courier Prime'; font-weight: 700; src: url(fonts/courier-prime-latin-700-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'La Belle Aurore'; src: url(fonts/la-belle-aurore-latin-400-normal.woff2) format('woff2'); font-display: swap; }
:root {
  /* cores da capa */
  --bg: #F3DEC4;          /* parede creme */
  --bg-warm: #E9BE95;     /* pêssego do topo da capa */
  --paper: #FBF3E6;       /* papel da carta */
  --ink: #33200A;         /* marrom do VIVA */
  --ink-soft: #66452C;    /* texto secundário (contraste 6:1 no creme) */
  --wine: #6E1E0A;        /* tijolo do JESUS: botões e destaques */
  --wine-hover: #8A2A12;
  --amber: #C8641C;       /* luz de dentro da casa */
  --gold: #D9963F;        /* brilho das luzes */
  --pine: #2E4A26;        /* guirlanda */
  --ok: #2E5A26;
  --line: rgba(110, 30, 10, .22);
  --shadow: 0 18px 40px rgba(80, 30, 5, .22);
  /* tipografia */
  --display: 'Abril Fatface', 'Didot', Georgia, serif;
  --body: 'Merriweather', Georgia, serif;
  --type: 'Courier Prime', 'Courier New', monospace;
  --hand: 'La Belle Aurore', 'Segoe Script', cursive;
  /* ritmo */
  --ease: cubic-bezier(.22, .8, .2, 1);
  color-scheme: light;
}
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(255, 200, 120, .55), transparent 70%),
    radial-gradient(50% 35% at 90% 8%, rgba(255, 180, 100, .4), transparent 70%),
    linear-gradient(180deg, var(--bg-warm) 0, var(--bg) 520px);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; }
#reveal-slot { display: flex; flex-direction: column; gap: 16px; }
#reveal-slot > .reveal { margin-bottom: 8px; }
.wrap { max-width: 480px; margin: 0 auto; padding-block: 8px 48px; display: flex; flex-direction: column; gap: 22px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Entrada: a capa e a porta ===== */
.intro { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: radial-gradient(80% 60% at 50% 30%, #F6DCC0, var(--bg-warm) 75%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
.intro .kick, .home .kick { font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .24em; color: var(--wine); text-transform: uppercase; }
.intro h1, .home h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7.6vw, 38px); line-height: 1.12; margin: 0; max-width: 420px; color: var(--ink); text-wrap: balance; }
.intro .sub, .home .sub { margin: 0; font-size: 16px; line-height: 1.6; color: var(--ink-soft); max-width: 340px; }
.cover { position: relative; width: min(82vw, 46vh, 400px); aspect-ratio: 1; overflow: hidden; box-shadow: var(--shadow); border: 6px solid var(--paper); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: 58.5% 82%; transition: transform 1.6s cubic-bezier(.7, 0, .3, 1); }
.flash { position: fixed; inset: 0; z-index: 21; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 55%, #FFF1CF 0%, #FFD08A 45%, #E9A65C 100%); transition: opacity .6s ease .6s; }
.intro.open .cover { border-color: transparent; box-shadow: none; overflow: visible; }
.intro.open .cover img { transform: scale(8); }
.intro.open .fade { opacity: 0; transition: opacity .35s ease; }
.intro.open + .flash { opacity: 1; }
.flash.out { opacity: 0 !important; transition: opacity .8s ease; }
.enter { min-height: 52px; min-width: 200px; padding: 0 32px; border: 0; border-radius: 999px; background: var(--wine); color: var(--paper); font-family: var(--type); font-size: 15px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 18px rgba(110, 30, 10, .3); transition: background .2s ease, transform .15s ease; }
.enter:hover { background: var(--wine-hover); }
.enter:active { transform: scale(.98); }

/* ===== Casa: nome e cafezinho ===== */
.home { position: fixed; inset: 0; z-index: 19; overflow-y: auto; background: radial-gradient(70% 45% at 50% 28%, #FFE3B8 0%, #F4CFA2 45%, var(--bg-warm) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); text-align: center; animation: fadein .8s ease both; transition: opacity .6s ease; }
.home.gone { opacity: 0; pointer-events: none; }
@keyframes fadein { from { opacity: 0; } }
.home .answer { width: 100%; max-width: 360px; margin-top: 4px; }
.table { position: relative; width: min(84vw, 340px); height: 190px; }
.table::after { content: ""; position: absolute; left: -6%; right: -6%; bottom: 0; height: 26px; border-radius: 50%; background: radial-gradient(ellipse, rgba(110, 50, 10, .22), transparent 70%); }
.env { position: absolute; left: 0; bottom: 18px; width: 62%; aspect-ratio: 3 / 2; background: var(--paper) url(img/papel-quente.jpg) 0 0 / 220px 150px; transform: rotate(-6deg); box-shadow: 0 14px 28px rgba(80, 30, 5, .3); overflow: hidden; }
.env::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.4%, rgba(110, 60, 30, .28) 50%, transparent 50.6%), linear-gradient(to bottom left, transparent 49.4%, rgba(110, 60, 30, .28) 50%, transparent 50.6%); background-size: 100% 120%; background-repeat: no-repeat; }
.env .seal { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -38%); border-radius: 50%; background: radial-gradient(circle at 38% 35%, #B8432A, var(--wine) 60%, #3E0E04); box-shadow: 0 3px 6px rgba(0, 0, 0, .35); }
.env .to { position: absolute; left: 9%; bottom: 9%; font-family: var(--hand); font-size: 20px; color: var(--ink); white-space: nowrap; }
.env .stp { position: absolute; right: 7%; top: 8%; width: 16%; aspect-ratio: 4 / 5; border: 2px dashed rgba(110, 30, 10, .45); }
.cup { position: absolute; right: 2%; bottom: 10px; width: 38%; }
.steam path { animation: steam 3.2s ease-in-out infinite; opacity: 0; }
.steam path:nth-child(2) { animation-delay: 1s; }
.steam path:nth-child(3) { animation-delay: 2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-14px); } }

/* ===== Topo da página ===== */
.brand { position: relative; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.brand img { display: block; width: 100%; height: auto; -webkit-mask-image: radial-gradient(75% 70% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(75% 70% at 50% 50%, #000 55%, transparent 100%); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--wine); }
.bar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 0 4px rgba(200, 100, 28, .2); }

/* Selos */
.seals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.sealbox { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--ink-soft); }
.sealbox .stamp { display: block; width: 100%; max-width: 70px; aspect-ratio: 4 / 5; padding: 4px; box-sizing: border-box; background: radial-gradient(circle at 4px 4px, transparent 2.4px, var(--paper) 2.9px) -4px -4px / 8px 8px; filter: drop-shadow(0 3px 5px rgba(80, 30, 5, .15)); }
.sealbox .art { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border: 1.5px dashed rgba(110, 30, 10, .35); box-sizing: border-box; background: rgba(233, 190, 149, .35); }
.sealbox .art b { font-family: var(--display); font-weight: 400; font-size: 24px; color: rgba(110, 30, 10, .55); }
.sealbox .stampimg { display: block; width: 100%; max-width: 70px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 4px 6px rgba(80, 30, 5, .3)); animation: stick .5s var(--ease) both; }
@keyframes stick { from { transform: rotate(-14deg) scale(1.35); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.sealbox.today { color: var(--wine); }
.sealbox.today .stamp { animation: glow 2.2s ease-in-out infinite; }
.sealbox.today .art { border-color: var(--wine); background: rgba(255, 210, 140, .55); }
@keyframes glow { 50% { transform: scale(1.06); } }
.bigstamp { width: 132px; height: auto; align-self: flex-start; transform: rotate(-4deg); filter: drop-shadow(0 10px 16px rgba(80, 30, 5, .3)); }

/* ===== A carta datilografada ===== */
.term { background: var(--paper) url(img/papel-quente.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 24px 20px 20px; position: relative; box-shadow: var(--shadow); }
.term::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--wine) 0 18px, transparent 18px 28px, var(--pine) 28px 46px, transparent 46px 56px); opacity: .9; }
.term .head { display: flex; justify-content: space-between; gap: 10px; font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--wine); text-transform: uppercase; padding-bottom: 12px; border-bottom: 1.5px dashed rgba(110, 30, 10, .3); margin-bottom: 14px; }
.lines { font-family: var(--type); font-size: 16px; line-height: 1.6; min-height: 110px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lines .hi { font-family: var(--hand); font-size: 26px; line-height: 1.4; color: var(--ink); }
.lines .p { color: var(--wine); font-weight: 700; }
.lines .q { font-family: var(--display); font-size: 23px; line-height: 1.25; color: var(--ink); display: block; margin: 8px 0 2px; white-space: normal; text-wrap: balance; }
.lines .ok { color: var(--ok); font-weight: 700; }
.lines .err { color: var(--wine); }
.lines .dim { color: var(--ink-soft); }
.caret { display: inline-block; width: .55em; height: 1.1em; background: var(--ink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.answer { display: flex; gap: 8px; margin-top: 14px; }
.answer label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.answer input { flex: 1; min-width: 0; min-height: 52px; padding: 0 14px; background: #FFFDF8; color: var(--ink); border: 1.5px solid var(--ink-soft); border-radius: 10px; font-family: var(--type); font-size: 17px; font-weight: 700; letter-spacing: .06em; }
.answer input::placeholder { color: #8F7560; font-weight: 400; }
.answer button { min-height: 52px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--wine); color: var(--paper); font-family: var(--type); font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: background .2s ease; }
.answer button:hover { background: var(--wine-hover); }
.hintbtn { margin-top: 10px; min-height: 44px; background: none; border: 0; padding: 4px 0; color: var(--wine); font-family: var(--type); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.term.shake { animation: tshake .4s ease; }
@keyframes tshake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* ===== Revelações ===== */
.reveal { display: flex; flex-direction: column; gap: 16px; animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: .001; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.kicker { font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .22em; color: var(--wine); text-transform: uppercase; }
.reveal h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8.4vw, 40px); line-height: 1.1; margin: 0; color: var(--ink); text-wrap: balance; }
.reveal p { margin: 0; font-size: 16px; line-height: 1.7; }
.pic { display: block; width: 100%; height: auto; box-shadow: var(--shadow); border: 6px solid var(--paper); box-sizing: border-box; }
.postal { background: var(--paper) url(img/papel-quente.jpg) 0 0 / 290px 200px; padding: 10px 10px 0; transform: rotate(-1.5deg); box-shadow: var(--shadow); }
.postal img { display: block; width: 100%; height: auto; }
.postal .cap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 4px; color: var(--ink); }
.postal .cap .h { font-family: var(--hand); font-size: 21px; }
.postal .cap .m { font-family: var(--type); font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--wine); text-transform: uppercase; white-space: nowrap; }
.note { background: var(--paper) url(img/papel-quente.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 24px 20px; font-family: var(--body); font-size: 17px; line-height: 1.7; white-space: pre-line; box-shadow: var(--shadow); border-top: 6px solid var(--wine); }
.note .hi { display: block; font-family: var(--hand); font-size: 28px; line-height: 1.3; margin-bottom: 8px; }
.note .sign { display: block; margin-top: 16px; font-family: var(--hand); font-size: 24px; line-height: 1.3; color: var(--wine); }

/* Vídeos */
.player { position: relative; width: 100%; max-width: 300px; aspect-ratio: 9 / 16; margin: 0 auto; background: #2A1606; overflow: hidden; border-radius: 14px; box-shadow: var(--shadow); }
.player video { width: 100%; height: 100%; object-fit: cover; display: block; }
.player .bg { position: absolute; inset: 0; display: flex; filter: blur(12px) brightness(.55); transform: scale(1.15); }
.player .bg img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.player .ph .av { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; border: 3px solid var(--gold); }
.player .ph .av img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--paper); }
.player .ph .play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--paper); color: var(--wine); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.player .tag { position: absolute; left: 12px; top: 12px; background: var(--paper); color: var(--ink); padding: 4px 12px; font-family: var(--hand); font-size: 19px; z-index: 2; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); transform: rotate(-2deg); }
.player .bar2 { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); width: 0; z-index: 2; }
.player .fine { color: var(--paper); }
.chooser { display: flex; flex-direction: column; gap: 14px; background: rgba(251, 243, 230, .7); border: 1px solid var(--line); border-radius: 16px; padding: 20px 14px; }
.chooser .ask { font-family: var(--display); font-size: 24px; line-height: 1.2; text-align: center; text-wrap: balance; margin: 0; }
.chooser .sub { font-size: 14px; color: var(--ink-soft); text-align: center; margin: 0; }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 8px; }
.act { width: calc(25% - 6px); min-width: 76px; min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; font-family: var(--type); }
.act .av { width: 68px; height: 68px; border-radius: 50%; overflow: hidden; display: flex; border: 3px solid var(--paper); box-shadow: 0 0 0 1.5px var(--line), 0 6px 14px rgba(80, 30, 5, .25); transition: transform .2s ease, box-shadow .2s ease; }
.act .av img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
.act .av img + img { border-left: 2px solid var(--paper); }
.act .nm { font-size: 13px; font-weight: 700; line-height: 1.3; text-align: center; }
.act:hover .av { transform: translateY(-2px); }
.act[aria-pressed="true"] .av { box-shadow: 0 0 0 3px var(--wine), 0 6px 14px rgba(80, 30, 5, .25); }
.act.locked { opacity: .4; cursor: not-allowed; }
.act.locked .av { filter: grayscale(1); }
.after .fine { text-align: center; }

.btn { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 14px 22px; border: 0; border-radius: 999px; cursor: pointer; text-decoration: none; font-family: var(--type); font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: transform .15s ease, background .2s ease, color .2s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--wine); color: var(--paper); box-shadow: 0 8px 18px rgba(110, 30, 10, .28); }
.btn-primary:hover { background: var(--wine-hover); }
.btn-ghost { background: transparent; color: var(--wine); border: 2px solid var(--wine); }
.btn-ghost:hover { background: rgba(110, 30, 10, .07); }
.fine { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0; }
.past { border-top: 1px solid var(--line); }
.past summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--wine); }
.past .inner { display: flex; flex-direction: column; gap: 26px; padding-top: 10px; }
.rename { align-self: center; min-height: 44px; background: none; border: 0; color: var(--ink-soft); font-family: var(--type); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
.copyline input { width: 100%; box-sizing: border-box; min-height: 46px; background: #FFFDF8; color: var(--ink); border: 1.5px solid var(--ink-soft); border-radius: 10px; padding: 0 12px; font-family: var(--type); font-size: 14px; }
.footer { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--type); font-size: 13px; font-weight: 700; letter-spacing: .24em; color: var(--ink-soft); }
.footer .chip { background: var(--paper); padding: 7px 11px; border-radius: 6px; display: flex; }
.footer .chip img { width: 44px; height: auto; display: block; }
.testbar { background: var(--paper); color: var(--ink); border: 1px dashed var(--wine); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--type); font-size: 13px; margin-top: 8px; }
.testbar button { font-family: var(--type); font-size: 13px; min-height: 36px; padding: 6px 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.testbar button[aria-pressed="true"] { background: var(--wine); color: var(--paper); border-color: var(--wine); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .caret, .sealbox.today .stamp, .sealbox .stampimg, .reveal, .term.shake, .steam path, .home { animation: none; }
  .steam path { opacity: .6; }
  .cover img, .flash, .intro.open .fade { transition: none; }
  .intro.open .cover img { transform: none; }
}
</style>

</head>
<body>
<!-- ENTRADA: a capa, a porta se abre -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-t">
  <div class="kick fade">Você é bem-vindo(a)</div>
  <div class="cover"><img src="img/capa.jpg" alt="Capa de Viva Jesus: os artistas e uma porta em arco, com guirlanda, aberta para uma sala iluminada" width="1200" height="1200"></div>

  <button class="enter fade" id="enter" type="button">Entrar</button>
  <p class="sub fade">Entre. Temos uma surpresa para você.</p>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>

<!-- CASA: nome e cafezinho -->
<div class="home" id="home" hidden role="dialog" aria-modal="true" aria-labelledby="home-t">
  <div class="table" aria-hidden="true">
    <div class="env"><span class="stp"></span><span class="seal"></span><span class="to" id="env-to">Para: você</span></div>
    <svg class="cup" viewBox="0 0 120 130">
      <g class="steam" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <path d="M42 46 C34 36 50 30 42 18"></path><path d="M60 46 C52 34 68 28 60 12"></path><path d="M78 46 C70 36 86 30 78 18"></path>
      </g>
      <ellipse cx="60" cy="122" rx="54" ry="7" fill="#9A5A2A"></ellipse>
      <ellipse cx="60" cy="119" rx="46" ry="5" fill="#FBF3E6"></ellipse>
      <path d="M96 66 C116 66 116 96 94 96" fill="none" stroke="#FBF3E6" stroke-width="7"></path>
      <path d="M22 54 L98 54 L92 104 C90 114 82 118 72 118 L48 118 C38 118 30 114 28 104 Z" fill="#FBF3E6"></path>
      <path d="M26 70 L94 70" stroke="#6E1E0A" stroke-width="5"></path>
      <path d="M27 78 L93 78" stroke="#2E4A26" stroke-width="3"></path>
      <ellipse cx="60" cy="54" rx="38" ry="6" fill="#4A2408"></ellipse>
    </svg>
  </div>
  <div class="kick" id="home-k">Você está em casa</div>
  <h1 id="home-t">Que bom que você chegou.</h1>
  <p class="sub" id="home-sub"></p>
  <form class="answer" id="nameform" hidden>
    <label for="nm-in">Seu nome</label>
    <input id="nm-in" name="nome" type="text" maxlength="20" autocomplete="given-name" spellcheck="false" placeholder="seu primeiro nome">
    <button type="submit">Entrar</button>
  </form>
  <button class="enter" id="homego" type="button" hidden>Abrir a carta</button>
</div>

<div class="wrap">
  <div class="testbar" id="testbar" hidden>
    <strong>Teste · simular dia:</strong>
    <span id="testdays" style="display:flex;flex-wrap:wrap;gap:6px"></span>
  </div>

  <div class="brand"><img src="img/lettering.jpg" alt="Viva Jesus" width="880" height="510"></div>

  <div class="bar">
    <div><span class="dot" aria-hidden="true"></span>Sua carta</div>
    <div id="bar-right">Selo 1 de 4</div>
  </div>

  <div class="seals" id="seals" aria-label="Selos da sua carta"></div>

  <section class="term" id="term" aria-label="Carta do dia">
    <div class="head"><span id="letter-to">Carta para você</span><span id="letter-date">Viva Jesus</span></div>
    <div class="lines" id="lines" aria-live="polite"></div>
    <form class="answer" id="answer" hidden>
      <label for="ans">Sua resposta</label>
      <input id="ans" name="resposta" type="text" autocomplete="off" spellcheck="false" placeholder="sua resposta">
      <button type="submit">Colar selo</button>
    </form>
    <button class="hintbtn" id="hintbtn" type="button" hidden>Pedir uma dica</button>
  </section>

  <div id="reveal-slot"></div>

  <button class="rename" id="rename" type="button" hidden>Não é você? Trocar nome</button>

  <details class="past" id="past" hidden>
    <summary>Selos já colados</summary>
    <div class="inner" id="past-inner"></div>
  </details>

  <div class="footer">
    <span class="chip"><img src="img/logo_gba.webp" alt="GBA Music"></span>
    <span>17 · XI</span>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
var CONFIG = {
  presaveUrl: 'https://SEU-LINK-DE-PRE-SAVE',
  listenUrl: 'https://SEU-SMARTLINK',
  teaserVideo: 'videos/trechinho.mp4',                 // selo 3: trechinho em primeira mão (arquivo na pasta videos/)
  premiereUrl: 'https://SEU-LINK-DA-ESTREIA-NO-YOUTUBE', // selo 4: estreia agendada (ativar o sininho)
  siteUrl: 'https://gbamusic.github.io/portas-abertas/',
  launchDate: '2026-11-17'
};
/* Respostas embaralhadas (texto invertido em base64).  */
var DAYS = [
  { d: '2026-11-13', label: '13/11', q: 'Em que cidade Jesus nasceu?', k: 'TUVMRUI=', hint: 'Fica na Judeia e começa com B.', reveal: 'familia', next: 'o nome da música que vamos cantar juntos.' },
  { d: '2026-11-14', label: '14/11', q: 'Qual nome de Jesus significa “Deus conosco”?', k: 'TEVVTkFNRQ==', hint: 'Está em Mateus 1,23. Começa com E.', reveal: 'capa', next: 'um aperitivo antes da ceia.' },
  { d: '2026-11-15', label: '15/11', q: 'O que guiou os Magos até o Menino?', k: 'QUxFUlRTRQ==', hint: 'Brilhou no céu do Oriente e guiou três reis.', reveal: 'trecho', next: 'o último selo.' },
  { d: '2026-11-16', label: '16/11', q: null, k: 'QUlSQU0=', hint: null, reveal: 'obrigado', next: '' }
];
DAYS[3].q = 'Qual é o nome da mãe de Jesus?';
DAYS[3].hint = 'Começa com M e foi visitada pelo anjo Gabriel.';
/* Selo 1: um vídeo por artista. Vazio = tela de exemplo. */
var ACTS = [
  { id: 'danubia', name: 'Danúbia', faces: ['danubia'], video: '' },
  { id: 'davidson', name: 'Davidson Silva', faces: ['davidson'], video: '' },
  { id: 'fatima', name: 'Fátima Souza', faces: ['fatima'], video: '' },
  { id: 'flavio', name: 'Flávio Vitor Jr.', faces: ['flavio'], video: '' },
  { id: 'gbaworship', name: 'GBA Worship', faces: ['jessica', 'herrison'], video: '' },
  { id: 'ramonrafael', name: 'Ramon e Rafael', faces: ['ramon', 'rafael'], video: '' },
  { id: 'peregrino', name: 'Um Peregrino', faces: ['peregrino'], video: '' }
];

function $(id) { return document.getElementById(id); }
var params = new URLSearchParams(location.search);
var hash = (location.hash || '').replace('#', '');
var testMode = params.get('teste') === '1' || hash === 'teste' || CONFIG.siteUrl.indexOf('SEU-SITE') >= 0;
var overrideDate = params.get('data') || null;
function todaySP() { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
if (testMode && !overrideDate && todaySP() < DAYS[0].d) overrideDate = DAYS[0].d;
function today() { return overrideDate || todaySP(); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function key(w) { try { return btoa(w.split('').reverse().join('')); } catch (e) { return ''; } }
function matches(input, k) { var words = norm(input).split(' '); var all = norm(input).replace(/ /g, ''); return words.some(function (w) { return key(w) === k; }) || key(all) === k; }
function cleanName(s) { return (s || '').replace(/[^\p{L}\p{M}' -]/gu, '').trim().split(' ')[0].slice(0, 20); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var nome = cleanName(params.get('nome'));
if (nome) store('vj-nome', nome); else nome = cleanName(store('vj-nome'));
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function todayIndex() { var t = today(), n = -1; DAYS.forEach(function (d, i) { if (d.d <= t) n = i; }); return n; }
function launched() { return today() >= CONFIG.launchDate; }
function solved(i) { return store('vj-porta-' + DAYS[i].d) === '1'; }

/* ===== Entrada ===== */
document.body.classList.add('locked');
$('enter').addEventListener('click', function () {
  var intro = $('intro');
  intro.classList.add('open'); intro.classList.add('gone');
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
  setTimeout(function () {
    intro.hidden = true; showHome();
    var f = $('flash'); f.classList.add('out');
    setTimeout(function () { f.hidden = true; }, 900);
  }, reduce ? 200 : 2000);
});

/* ===== Casa: nome e cafezinho ===== */
var homeReady = false;
function showHome() {
  var h = $('home'); h.hidden = false; h.classList.remove('gone');
  document.body.classList.add('locked');
  if (!nome) {
    $('home-k').textContent = 'Pode entrar';
    $('home-t').textContent = 'Que bom que você chegou.';
    $('home-sub').textContent = 'Aqui em casa a gente chama cada um pelo nome. Como podemos te chamar?';
    $('env-to').textContent = 'Para: você';
    $('nameform').hidden = false; $('homego').hidden = true;
    $('nm-in').value = ''; $('nm-in').focus();
    return;
  }
  var back = store('vj-visitou') === '1';
  $('home-k').textContent = 'Você está em casa';
  $('home-t').textContent = back ? 'Que bom te ver de novo, ' + nome + '.' : 'Fica à vontade, ' + nome + '.';
  $('home-sub').textContent = back
    ? 'O café já está passando. A sua carta está na mesa, esperando o selo de hoje.'
    : 'Você está em casa. Enquanto a gente passa um cafezinho, chegou uma carta no seu nome.';
  $('env-to').textContent = 'Para: ' + nome;
  $('nameform').hidden = true; $('homego').hidden = false; $('homego').focus();
}
$('homego').addEventListener('click', function () {
  store('vj-visitou', '1');
  var h = $('home'); h.classList.add('gone');
  setTimeout(function () { h.hidden = true; document.body.classList.remove('locked'); homeReady = true; render(); window.scrollTo(0, 0); }, reduce ? 50 : 600);
});

/* ===== Datilografia ===== */
var typing = null;
function type(parts, done) {
  var box = $('lines'); box.textContent = '';
  if (typing) clearTimeout(typing);
  var caret = document.createElement('span'); caret.className = 'caret'; caret.setAttribute('aria-hidden', 'true');
  var i = 0;
  function nextPart() {
    if (i >= parts.length) { box.appendChild(caret); if (done) done(); return; }
    var p = parts[i++];
    var el = document.createElement('span'); if (p.c) el.className = p.c;
    box.appendChild(el);
    var text = p.t + (p.c === 'q' ? '' : '\n');
    if (reduce) { el.textContent = text; nextPart(); return; }
    var j = 0;
    (function step() {
      el.textContent = text.slice(0, ++j);
      if (j < text.length) typing = setTimeout(step, p.c === 'q' || p.c === 'hi' ? 24 : 14);
      else typing = setTimeout(nextPart, 160);
    })();
  }
  nextPart();
}

/* ===== Vídeos ===== */
function faces(list) { return list.map(function (f) { return '<img src="img/a/' + f + '.jpg" alt="">'; }).join(''); }
function buildPlayer(opts) {
  var p = document.createElement('div'); p.className = 'player';
  var tag = '<span class="tag">Para: ' + esc(nome || 'você') + '</span>';
  if (opts.video) {
    p.innerHTML = tag + '<video playsinline controls preload="metadata"></video>';
    var v = p.querySelector('video'); v.src = opts.video; v.setAttribute('aria-label', opts.label);
    if (opts.fit) { v.style.objectFit = opts.fit; p.style.aspectRatio = 'auto'; p.style.maxWidth = '100%'; v.style.height = 'auto'; }
    v.addEventListener('error', function () { var e = document.createElement('p'); e.className = 'fine'; e.style.cssText = 'position:absolute;inset:auto 16px 40%;text-align:center'; e.textContent = 'O vídeo não carregou. Tente de novo em instantes.'; p.appendChild(e); });
    if (opts.autoplay) v.autoplay = true;
    v.addEventListener('ended', function () { if (opts.onEnd) opts.onEnd(); });
  } else {
    p.innerHTML = tag + '<div class="bg">' + opts.bg + '</div><div class="ph"><span class="av">' + opts.av + '</span><p></p><button class="play" type="button" aria-label="Tocar vídeo"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3 L19 11 L6 19 Z" fill="currentColor"></path></svg></button></div><span class="bar2"></span>';
    p.querySelector('p').textContent = opts.placeholder;
    var btn = p.querySelector('.play');
    btn.addEventListener('click', function () {
      btn.disabled = true; btn.style.opacity = '.4';
      var bar = p.querySelector('.bar2'), t0 = null, dur = 3500;
      function step(ts) { if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / dur); bar.style.width = (k * 100) + '%'; if (k < 1) requestAnimationFrame(step); else if (opts.onEnd) opts.onEnd(); }
      requestAnimationFrame(step);
    });
  }
  return p;
}
function buildChooser() {
  var box = document.createElement('div'); box.className = 'chooser';
  box.innerHTML = '<p class="ask">Escolha alguém da nossa família para ver uma mensagem especial.</p><p class="sub">Depois da primeira mensagem, os outros também ficam disponíveis.</p><div class="acts"></div><div class="stagearea"></div>';
  var acts = box.querySelector('.acts'), area = box.querySelector('.stagearea');
  function unlocked() { return store('vj-outros') === '1'; }
  function chosen() { return store('vj-escolha'); }
  function draw() {
    acts.textContent = '';
    ACTS.forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'act';
      var locked = chosen() && !unlocked() && chosen() !== a.id;
      if (locked) b.classList.add('locked');
      b.setAttribute('aria-pressed', String(chosen() === a.id));
      b.setAttribute('aria-label', a.name + (locked ? ' (libera depois da primeira mensagem)' : ''));
      b.innerHTML = '<span class="av">' + faces(a.faces) + '</span><span class="nm"></span>';
      b.querySelector('.nm').textContent = a.name;
      b.addEventListener('click', function () { if (!locked) play(a); });
      acts.appendChild(b);
    });
  }
  function play(a) {
    if (!chosen()) store('vj-escolha', a.id);
    draw(); area.textContent = '';
    var p = buildPlayer({ video: a.video, autoplay: true, label: 'Mensagem de ' + a.name, bg: faces(a.faces), av: faces(a.faces), placeholder: 'Aqui entra o vídeo de ' + a.name + ': “que bom ter você em casa com a gente…” (20 a 30 s, vertical).', onEnd: function () { finish(); } });
    area.appendChild(p);
    if (!reduce) setTimeout(function () { p.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
  }
  function finish() {
    var first = !unlocked(); store('vj-outros', '1'); draw();
    var old = area.querySelector('.after'); if (old) old.remove();
    var af = document.createElement('div'); af.className = 'after';
    af.innerHTML = '<p class="fine"></p>';
    af.querySelector('.fine').textContent = first ? 'Os outros também deixaram uma mensagem para você. Toque em outro rosto acima.' : 'Toque em outro rosto acima para ouvir mais alguém.';
    area.appendChild(af);
  }
  draw();
  return box;
}

/* ===== Revelações ===== */
function revealNode(kind) {
  var w = document.createElement('section'); w.className = 'reveal';
  var html = '';
  if (kind === 'familia') html = '<div class="kicker">Selo 1 · colado</div><h2>Que bom ter você em casa com a gente.</h2><div class="postal"><img src="img/artistas.jpg" alt="Os artistas de Viva Jesus reunidos numa sala decorada para o Natal" width="1100" height="700"><div class="cap"><span class="h">com carinho, de portas abertas</span><span class="m">GBA Music</span></div></div><p>Essa é a nossa família. Pode se sentar, o café já vem. E cada um aqui separou um recado só para você.</p>';
  else if (kind === 'capa') html = '<div class="kicker">Selo 2 · colado</div><h2>Viva Jesus.</h2><img class="pic" src="img/capa.jpg" alt="Capa do single Viva Jesus" width="800" height="800"><p>Esse é o nome da música que vamos cantar juntos neste Natal. Estamos ansiosos para celebrar com você e com quem você ama, cantando Viva Jesus.</p>';
  else if (kind === 'trecho') html = '<div class="kicker">Selo 3 · colado</div><h2>Um aperitivo antes da ceia.</h2><p>Está quase lá. A gente sempre fica ansioso pela ceia, mas tem que esperar a meia-noite. Só que aqui em casa ninguém espera com fome: escute um trechinho, em primeira mão.</p>';
  else if (kind === 'obrigado') html = '<div class="kicker">Selo 4 · colado</div><h2>Obrigado por entrar.</h2><div class="note"><span class="hi">Querido(a) ' + esc(nome || 'amigo') + ',</span>É um prazer ter você na nossa casa. Você faz parte de algo especial, e essa música também é sua.\n\nNo dia 17, contamos com você para ouvir e para compartilhar com quem é especial para você.<span class="sign">Com carinho, a família GBA Music</span></div><a class="btn btn-ghost" href="' + CONFIG.premiereUrl + '" target="_blank" rel="noopener">Ativar o lembrete da estreia</a><p class="fine">Abra a estreia no YouTube e toque no sininho para ser avisado quando começar.</p>';
  var num = { familia: 1, capa: 2, trecho: 3, obrigado: 4 }[kind];
  if (num) html = '<img class="bigstamp" src="img/selos/selo-' + num + '.webp" alt="Selo ' + num + ' de 4" width="411" height="520">' + html;
  w.innerHTML = html;
  if (kind === 'familia') w.appendChild(buildChooser());
  if (kind === 'trecho') w.appendChild(buildPlayer({ video: CONFIG.teaserVideo, fit: 'contain', label: 'Trechinho de Viva Jesus em primeira mão', bg: '<img src="img/capa.jpg" alt="">', av: '<img src="img/capa.jpg" alt="">', placeholder: 'Aqui entra o trechinho de Viva Jesus.' }));
  return w;
}
function ctaNode() {
  var f = document.createDocumentFragment();
  var a = document.createElement('a'); a.className = 'btn btn-primary'; a.target = '_blank'; a.rel = 'noopener'; a.href = CONFIG.presaveUrl; a.textContent = 'Salvar carta';
  var p = document.createElement('p'); p.className = 'fine'; p.textContent = 'Salve agora, para no dia 17 a música já estar na sua biblioteca.';
  f.appendChild(a); f.appendChild(p); return f;
}
function nextNode(i) {
  var n = document.createElement('div'); n.className = 'next';
  var d = DAYS[i + 1];
  n.innerHTML = '<span class="k">' + (d ? 'Amanhã · ' + d.label + ' · 00h' : 'Hoje · 00h') + '</span><span class="v"></span>';
  n.querySelector('.v').textContent = d ? 'Novo selo: ' + DAYS[i].next : 'À meia-noite, a sua carta pode ser lida.';
  return n;
}

/* ===== Tela ===== */
var wrong = 0;
function renderSeals(idx) {
  var box = $('seals'); box.textContent = '';
  DAYS.forEach(function (d, i) {
    var open = launched() || i < idx || (i === idx && solved(i));
    var el = document.createElement('div');
    el.className = 'sealbox' + (i === idx && !launched() && !open ? ' today' : '');
    el.setAttribute('aria-label', 'Selo ' + (i + 1) + ', ' + d.label + ', ' + (open ? 'colado' : 'ainda não'));
    el.innerHTML = (open ? '<img class="stampimg" src="img/selos/selo-' + (i + 1) + '.webp" alt="">' : '<span class="stamp"><span class="art"><b>' + (i + 1) + '</b></span></span>') + '<span>' + d.label + '</span>';
    box.appendChild(el);
  });
}
function renderPast(idx) {
  var upto = launched() ? DAYS.length : idx;
  var inner = $('past-inner'); inner.textContent = '';
  for (var i = 0; i < upto; i++) inner.appendChild(revealNode(DAYS[i].reveal));
  $('past').hidden = upto <= 0;
}
function render() {
  if (!homeReady) return;
  var idx = todayIndex();
  wrong = 0; $('hintbtn').hidden = true; $('answer').hidden = true;
  $('reveal-slot').textContent = '';
  $('term').classList.remove('shake');
  $('rename').hidden = !nome;
  $('letter-to').textContent = 'Carta para ' + (nome || 'você');
  $('letter-date').textContent = idx >= 0 && !launched() ? DAYS[idx].label : (launched() ? '17/11' : 'Viva Jesus');
  renderSeals(idx);

  if (!nome) { homeReady = false; showHome(); return; }
  renderPast(idx);

  if (launched()) {
    $('bar-right').textContent = 'Chegou';
    type([{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: 'os quatro selos estão colados.', c: 'ok' }, { t: 'a sua carta finalmente foi aberta.', c: 'ok' }, { t: 'Viva Jesus! Agora mande para alguém especial.', c: 'q' }]);
    var r = document.createElement('section'); r.className = 'reveal';
    r.innerHTML = '<img class="bigstamp" src="img/selos/carimbo-entregue.webp" alt="Carimbo: Entregue, 17 de novembro" width="300" height="300"><div class="kicker">17 · XI</div><h2>A carta finalmente foi aberta.</h2><div class="note"><span class="hi">Querido(a) ' + esc(nome) + ',</span>Cartas são feitas para quem é especial, e você é especial para nós.\n\nPor isso, hoje queremos celebrar juntos, com essa música, na nossa casa e na sua.<span class="sign">Viva Jesus! A família GBA Music</span></div><img class="pic" src="img/capa.jpg" alt="Capa do single Viva Jesus" width="800" height="800">';
    var a = document.createElement('a'); a.className = 'btn btn-primary'; a.href = CONFIG.listenUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ouvir agora';
    r.appendChild(a);
    var sh = document.createElement('button'); sh.type = 'button'; sh.className = 'btn btn-ghost'; sh.textContent = 'Mandar para alguém';
    var msg = document.createElement('p'); msg.className = 'fine'; msg.setAttribute('aria-live', 'polite');
    var cl = document.createElement('div'); cl.className = 'copyline'; cl.hidden = true; cl.innerHTML = '<label class="fine" for="share-url" style="position:absolute;left:-9999px">Link para enviar</label><input id="share-url" type="text" readonly>';
    sh.addEventListener('click', function () {
      var text = 'Tem uma carta de Natal para você: ' + CONFIG.siteUrl;
      function copy() {
        var input = cl.querySelector('input'); input.value = text; cl.hidden = false;
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { msg.textContent = 'Link copiado. Cole no WhatsApp de quem você ama.'; }).catch(function () { input.select(); msg.textContent = 'Selecione e copie o link acima.'; });
        else { input.select(); msg.textContent = 'Selecione e copie o link acima.'; }
      }
      if (navigator.share) navigator.share({ title: 'Uma carta de Natal', text: 'Tem uma carta de Natal para você:', url: CONFIG.siteUrl }).catch(copy); else copy();
    });
    r.appendChild(sh); r.appendChild(cl); r.appendChild(msg);
    $('reveal-slot').appendChild(r);
    return;
  }
  if (idx < 0) {
    $('bar-right').textContent = 'Abre 13/11';
    type([{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: 'esta carta só pode ser lida com 4 selos.', c: 'dim' }, { t: 'o primeiro selo chega em 13/11, à meia-noite.', c: 'p' }]);
    return;
  }
  $('bar-right').textContent = 'Selo ' + (idx + 1) + ' de 4';
  if (solved(idx)) { showSolved(idx, false); return; }
  var d = DAYS[idx];
  var intro = idx === 0
    ? [{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: 'que bom ter você aqui em casa.', c: 'dim' }, { t: 'esta carta é para você, mas para ler, ela precisa de 4 selos.', c: 'dim' }, { t: 'um selo por dia, até o dia 17.', c: 'dim' }, { t: 'para ganhar o selo de hoje, responda:', c: 'p' }]
    : [{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: idx + ' de 4 selos colados nesta carta.', c: 'ok' }, { t: 'para ganhar o selo de hoje, responda:', c: 'p' }];
  intro.push({ t: d.q, c: 'q' });
  type(intro, function () { $('answer').hidden = false; $('ans').value = ''; });
}
function showSolved(idx, fresh) {
  var lines = [{ t: 'selo ' + (idx + 1) + ' colado na sua carta.', c: 'ok' }, { t: (idx + 1) + ' de 4 selos.', c: 'ok' }];
  if (DAYS[idx + 1]) lines.push({ t: 'o próximo selo chega em ' + DAYS[idx + 1].label + ', à meia-noite.', c: 'p' });
  else lines.push({ t: 'à meia-noite, a carta pode ser lida.', c: 'p' });
  type(lines);
  renderSeals(idx);
  var slot = $('reveal-slot'); slot.textContent = '';
  slot.appendChild(revealNode(DAYS[idx].reveal));
  slot.appendChild(ctaNode());
  if (fresh && !reduce) setTimeout(function () { slot.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 900);
}

$('nameform').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = cleanName($('nm-in').value);
  if (!v) { $('nm-in').focus(); return; }
  nome = v; store('vj-nome', v); showHome();
});
$('rename').addEventListener('click', function () { nome = ''; store('vj-nome', ''); try { localStorage.removeItem('vj-visitou'); } catch (e) {} homeReady = false; showHome(); });
$('answer').addEventListener('submit', function (e) {
  e.preventDefault();
  var idx = todayIndex(); if (idx < 0) return;
  var v = $('ans').value;
  if (!norm(v)) { $('ans').focus(); return; }
  if (matches(v, DAYS[idx].k)) {
    store('vj-porta-' + DAYS[idx].d, '1');
    $('answer').hidden = true; $('hintbtn').hidden = true;
    if (navigator.vibrate) { try { navigator.vibrate([30, 40, 60]); } catch (er) {} }
    showSolved(idx, true);
  } else {
    wrong++;
    var t = $('term'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    var line = document.createElement('span'); line.className = 'err'; line.textContent = '\n“' + v.trim() + '” não é a resposta. tente de novo.';
    $('lines').insertBefore(line, $('lines').querySelector('.caret'));
    if (wrong >= 2) $('hintbtn').hidden = false;
    $('ans').select();
  }
});
$('hintbtn').addEventListener('click', function () {
  var idx = todayIndex();
  var line = document.createElement('span'); line.className = 'dim'; line.textContent = '\ndica: ' + DAYS[idx].hint;
  $('lines').insertBefore(line, $('lines').querySelector('.caret'));
  $('hintbtn').hidden = true; $('ans').focus();
});

function renderTestbar() {
  if (!testMode) return;
  $('testbar').hidden = false;
  var box = $('testdays'); box.textContent = '';
  DAYS.map(function (d) { return [d.d, d.label]; }).concat([['2026-11-17', '17/11']]).forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = p[1];
    b.setAttribute('aria-pressed', String(today() === p[0]));
    b.addEventListener('click', function () { overrideDate = p[0]; render(); renderTestbar(); });
    box.appendChild(b);
  });
  var z = document.createElement('button'); z.type = 'button'; z.textContent = 'Zerar';
  z.addEventListener('click', function () { DAYS.forEach(function (d) { try { localStorage.removeItem('vj-porta-' + d.d); } catch (e) {} }); try { ['vj-escolha', 'vj-outros', 'vj-nome', 'vj-visitou'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} nome = cleanName(params.get('nome')); homeReady = false; showHome(); });
  box.appendChild(z);
}
renderTestbar();
</script>
